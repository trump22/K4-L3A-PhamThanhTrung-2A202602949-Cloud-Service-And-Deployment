name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test checkpoints
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run checkpoint tests
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: fake://
        run: >-
          python -m pytest tests/
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:ci .

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke test deployed service
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "PUBLIC_URL is required as a GitHub Actions variable when Render deployment is enabled."
            exit 1
          fi
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error "$PUBLIC_URL/health"; then
              exit 0
            fi
            echo "Health check attempt $attempt/15 failed; waiting 20 seconds."
            sleep 20
          done
          echo "The deployed service did not become healthy within 5 minutes."
          exit 1
